<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1D3166" />
      <stop offset="100%" stop-color="#0A192F" />
    </radialGradient>
    
    <!-- Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B2EC" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <!-- Glow Filter for Premium Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth Rounded Background Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Glowing Orbital Tracks (representing global networks) -->
  <path d="M 120 256 A 136 136 0 0 1 376 150" fill="none" stroke="#00B2EC" stroke-width="24" stroke-linecap="round" opacity="0.4" filter="url(#glow)" />
  <path d="M 392 256 A 136 136 0 0 1 136 362" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" opacity="0.4" filter="url(#glow)" />

  <!-- The Stylized Guide D Emblem -->
  <g transform="translate(256, 256)">
    <!-- Main D shape -->
    <path d="M -80 -110 
             L 0 -110 
             A 110 110 0 0 1 110 0 
             A 110 110 0 0 1 0 110 
             L -80 110 
             Z" 
          fill="none" 
          stroke="url(#emblemGrad)" 
          stroke-width="52" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#glow)" />
          
    <!-- Inner Dynamic Guide Arrow (representing guidance/Daleel) -->
    <path d="M -24 -45 L 26 0 L -24 45 Z" fill="#F9A01B" filter="url(#glow)" />
    
    <!-- Glowing core white node -->
    <circle cx="26" cy="0" r="14" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
